name: Add contest persistence to Mega Analyzer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add contest separation and persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove any old authentication/integration panel if it is still present.
          text = re.sub(
              r'\n?<!-- NEON-MEGA-INTEGRATION -->.*?</section>\n\n',
              '\n', text, count=1, flags=re.S
          )

          # Remove any old Neon module integration script.
          marker = '<script type="module">'
          start = text.find(marker)
          if start != -1:
              end = text.find('</script>', start)
              if end != -1:
                  block = text[start:end + len('</script>')]
                  if 'neon.auth' in block or 'NEON_AUTH_URL' in block:
                      text = text[:start] + text[end + len('</script>'):]

          # Add the contest selector immediately before the participants card.
          contest_ui = r'''
<!-- CONTROLE DO CONCURSO -->
<section class="card" id="contestCard">
<h2>🎟️ Concurso</h2>
<div class="grid">
    <div class="field">
        <label>Número do concurso</label>
        <input id="contestNumber" type="number" min="1" step="1" placeholder="Ex.: 2910">
    </div>
    <div class="field">
        <label>Status</label>
        <div id="contestStatus" class="info-box" style="margin-top:0">Digite o número do concurso.</div>
    </div>
</div>
<div class="actions">
    <button class="green" id="loadContestBtn" type="button">📂 Carregar concurso</button>
    <button class="secondary" id="newContestBtn" type="button">🆕 Novo concurso</button>
    <button id="saveContestBtn" type="button">💾 Salvar agora</button>
</div>
<div class="info-box">
<strong>Como funciona:</strong> cada número de concurso possui seu próprio conjunto de participantes, cotas, valores, configurações, jogos e resultados. Ao voltar a um concurso já cadastrado, os dados são recuperados automaticamente neste dispositivo.
</div>
</section>

'''
          if 'id="contestCard"' not in text:
              text = text.replace('<!-- PARTICIPANTES -->', contest_ui + '<!-- PARTICIPANTES -->', 1)

          # Add persistence code before the existing EVENTOS section.
          persistence = r'''
/* =========================
   PERSISTÊNCIA POR CONCURSO
========================= */

let activeContestNumber = '';
let contestSaveTimer = null;
let contestLoading = false;

function contestStorageKey(number){
    return `megaAnalyzerContest:${String(number).trim()}`;
}

function getContestNumber(){
    const value = String(document.getElementById('contestNumber')?.value || '').trim();
    return /^\d+$/.test(value) && Number(value) > 0 ? value : '';
}

function collectContestData(){
    return {
        version: 1,
        savedAt: new Date().toISOString(),
        participants: participants.map(p => ({
            id: p.id,
            name: p.name,
            quotas: Number(p.quotas) || 1
        })),
        games: games.map(g => ({
            type: g.type,
            numbers: [...g.numbers],
            combinations: Number(g.combinations) || 0,
            cost: Number(g.cost) || 0,
            origin: g.origin || ''
        })),
        fields: {
            quotaValue: document.getElementById('quotaValue').value,
            betBudget: document.getElementById('betBudget').value,
            simpleBetPrice: document.getElementById('simpleBetPrice').value,
            strategy: document.getElementById('strategy').value,
            generationMode: document.getElementById('generationMode').value,
            sixGames: document.getElementById('sixGames').value,
            multipleGames: document.getElementById('multipleGames').value,
            multipleNumbers: document.getElementById('multipleNumbers').value,
            manualGames: document.getElementById('manualGames').value,
            prizeSena: document.getElementById('prizeSena').value,
            otherSena: document.getElementById('otherSena').value,
            prizeQuina: document.getElementById('prizeQuina').value,
            prizeQuadra: document.getElementById('prizeQuadra').value,
            drawResult: document.getElementById('drawResult').value
        }
    };
}

function updateContestStatus(message, type='info'){
    const box = document.getElementById('contestStatus');
    if(!box) return;
    box.className = type === 'success' ? 'success' : type === 'danger' ? 'danger' : 'info-box';
    box.textContent = message;
}

function saveCurrentContest(showMessage=true){
    if(contestLoading) return false;
    const number = getContestNumber();
    if(!number){
        updateContestStatus('Digite um número de concurso válido.', 'danger');
        return false;
    }

    try{
        localStorage.setItem(contestStorageKey(number), JSON.stringify(collectContestData()));
        localStorage.setItem('megaAnalyzerLastContest', number);
        activeContestNumber = number;
        if(showMessage) updateContestStatus(`Concurso ${number} salvo neste dispositivo.`, 'success');
        return true;
    }catch(error){
        updateContestStatus('Não foi possível salvar os dados neste dispositivo.', 'danger');
        console.error(error);
        return false;
    }
}

function scheduleContestSave(){
    if(contestLoading || !getContestNumber()) return;
    clearTimeout(contestSaveTimer);
    contestSaveTimer = setTimeout(() => saveCurrentContest(false), 350);
}

function clearContestView(){
    contestLoading = true;
    participants = [];
    games = [];

    document.getElementById('quotaValue').value = '50';
    document.getElementById('betBudget').value = '0';
    document.getElementById('simpleBetPrice').value = '5';
    document.getElementById('strategy').value = 'maximum';
    document.getElementById('generationMode').value = 'random';
    document.getElementById('sixGames').value = '0';
    document.getElementById('multipleGames').value = '0';
    document.getElementById('multipleNumbers').value = '7';
    document.getElementById('manualGames').value = '';
    document.getElementById('prizeSena').value = '100000000';
    document.getElementById('otherSena').value = '0';
    document.getElementById('prizeQuina').value = '0';
    document.getElementById('prizeQuadra').value = '0';
    document.getElementById('drawResult').value = '';

    addParticipant('Participante 1', 1);
    addParticipant('Participante 2', 1);

    renderGames();
    document.getElementById('resultsSection').classList.add('hidden');
    document.getElementById('generationMessage').innerHTML = '';
    document.getElementById('manualMessage').innerHTML = '';
    document.getElementById('drawResultBox').innerHTML = '';
    document.getElementById('prizeResult').innerHTML = '';
    document.getElementById('analysisText').innerHTML = '';
    updateSummary();
    contestLoading = false;
}

function applyContestData(data){
    contestLoading = true;

    const fields = data.fields || {};
    const setValue = (id, fallback) => {
        if(fields[id] !== undefined) document.getElementById(id).value = fields[id];
        else if(fallback !== undefined) document.getElementById(id).value = fallback;
    };

    setValue('quotaValue', '50');
    setValue('betBudget', '0');
    setValue('simpleBetPrice', '5');
    setValue('strategy', 'maximum');
    setValue('generationMode', 'random');
    setValue('sixGames', '0');
    setValue('multipleGames', '0');
    setValue('multipleNumbers', '7');
    setValue('manualGames', '');
    setValue('prizeSena', '100000000');
    setValue('otherSena', '0');
    setValue('prizeQuina', '0');
    setValue('prizeQuadra', '0');
    setValue('drawResult', '');

    participants = Array.isArray(data.participants) ? data.participants.map(p => ({
        id: p.id || (Date.now() + Math.random()),
        name: p.name || 'Participante',
        quotas: Math.max(1, Number(p.quotas) || 1)
    })) : [];

    if(!participants.length){
        addParticipant('Participante 1', 1);
        addParticipant('Participante 2', 1);
    }

    games = Array.isArray(data.games) ? data.games.map(g => ({
        type: g.type || `${(g.numbers || []).length} números`,
        numbers: sortNumbers((g.numbers || []).map(Number)),
        combinations: Number(g.combinations) || combination((g.numbers || []).length),
        cost: Number(g.cost) || 0,
        origin: g.origin || ''
    })) : [];

    renderParticipants();
    updateSummary();

    if(games.length){
        renderGames();
        analyzeGames();
        document.getElementById('resultsSection').classList.remove('hidden');
    }else{
        renderGames();
        document.getElementById('resultsSection').classList.add('hidden');
    }

    contestLoading = false;
}

function loadContest(number=getContestNumber(), announce=true){
    number = String(number || '').trim();
    if(!/^\d+$/.test(number) || Number(number) <= 0){
        updateContestStatus('Digite um número de concurso válido.', 'danger');
        return;
    }

    document.getElementById('contestNumber').value = number;
    activeContestNumber = number;

    const raw = localStorage.getItem(contestStorageKey(number));

    if(raw){
        try{
            applyContestData(JSON.parse(raw));
            localStorage.setItem('megaAnalyzerLastContest', number);
            updateContestStatus(`Concurso ${number} carregado.`, 'success');
            return;
        }catch(error){
            console.error(error);
        }
    }

    clearContestView();
    localStorage.setItem('megaAnalyzerLastContest', number);
    updateContestStatus(`Concurso ${number} ainda não possui dados. Um novo bolão foi iniciado.`, 'info');
    if(announce) updateContestStatus(`Concurso ${number}: novo cadastro pronto para receber os dados.`, 'success');
}

function startNewContest(){
    const number = getContestNumber();
    if(!number){
        updateContestStatus('Digite primeiro o número do novo concurso.', 'danger');
        return;
    }

    if(localStorage.getItem(contestStorageKey(number))){
        const overwrite = confirm(`Já existe um cadastro para o concurso ${number}. Deseja limpar e começar novamente?`);
        if(!overwrite) return;
    }

    localStorage.removeItem(contestStorageKey(number));
    clearContestView();
    activeContestNumber = number;
    updateContestStatus(`Novo cadastro iniciado para o concurso ${number}.`, 'success');
    saveCurrentContest(false);
}

function restoreLastContest(){
    const input = document.getElementById('contestNumber');
    const last = localStorage.getItem('megaAnalyzerLastContest');
    if(last){
        input.value = last;
        loadContest(last, false);
    }else{
        input.value = '';
        updateContestStatus('Digite o número do concurso para começar.');
        clearContestView();
    }
}

/* Autosave: alterações de participantes, valores, configurações e jogos ficam vinculadas ao concurso ativo. */

const contestWatchedIds = [
    'quotaValue','betBudget','simpleBetPrice','strategy','generationMode',
    'sixGames','multipleGames','multipleNumbers','manualGames','prizeSena',
    'otherSena','prizeQuina','prizeQuadra','drawResult'
];

function installContestAutosave(){
    contestWatchedIds.forEach(id => {
        const el = document.getElementById(id);
        if(el) el.addEventListener('input', scheduleContestSave);
        if(el && (el.tagName === 'SELECT')) el.addEventListener('change', scheduleContestSave);
    });
}

/* Intercepta as principais alterações para salvar automaticamente sem exigir botão. */
const originalRenderParticipants = renderParticipants;
renderParticipants = function(){
    originalRenderParticipants();
    if(!contestLoading) scheduleContestSave();
};

const originalUpdateParticipant = updateParticipant;
updateParticipant = function(id,key,value){
    originalUpdateParticipant(id,key,value);
    scheduleContestSave();
};

const originalAddParticipant = addParticipant;
addParticipant = function(name='', quotas=1){
    originalAddParticipant(name, quotas);
    scheduleContestSave();
};

const originalRemoveParticipant = removeParticipant;
removeParticipant = function(id){
    originalRemoveParticipant(id);
    scheduleContestSave();
};

const originalRenderGames = renderGames;
renderGames = function(){
    originalRenderGames();
    if(!contestLoading) scheduleContestSave();
};

const originalClearGames = clearGames;
clearGames = function(){
    originalClearGames();
    scheduleContestSave();
};

const originalAddManualGames = addManualGames;
addManualGames = function(){
    originalAddManualGames();
    scheduleContestSave();
};

const originalGenerateGames = generateGames;
generateGames = function(){
    originalGenerateGames();
    scheduleContestSave();
};

'''

          if 'function saveCurrentContest' not in text:
              text = text.replace('/* =========================\n   EVENTOS\n========================= */', persistence + '\n/* =========================\n   EVENTOS\n========================= */', 1)

          # Replace the initialization block so it no longer blindly creates participants on every page load.
          old_init = '''addParticipant(\n    'Participante 1',\n    1\n);\n\n\naddParticipant(\n    'Participante 2',\n    1\n);\n\n\nupdateSummary();'''
          new_init = '''installContestAutosave();\n\ndocument.getElementById('loadContestBtn').addEventListener('click', () => loadContest());\ndocument.getElementById('newContestBtn').addEventListener('click', startNewContest);\ndocument.getElementById('saveContestBtn').addEventListener('click', () => saveCurrentContest(true));\ndocument.getElementById('contestNumber').addEventListener('change', () => loadContest());\ndocument.getElementById('contestNumber').addEventListener('keydown', event => {\n    if(event.key === 'Enter') loadContest();\n});\n\nrestoreLastContest();\nupdateSummary();'''
          if old_init in text:
              text = text.replace(old_init, new_init, 1)
          elif 'restoreLastContest();' not in text:
              text = text.replace('</script>\n\n\n\n</body>', new_init + '\n\n</script>\n\n\n\n</body>', 1)

          # Keep the existing app free of authentication.
          forbidden = ['neonEmail','neonPassword','neonSignIn','neonSignUp','neonGoogle','neonForgot','NEON_AUTH_URL','neon.auth']
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Authentication marker still present: {item}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify contest persistence
        run: |
          grep -q 'id="contestCard"' index.html
          grep -q 'function saveCurrentContest' index.html
          grep -q 'function loadContest' index.html
          grep -q 'megaAnalyzerContest:' index.html
          ! grep -q 'neonEmail' index.html
          ! grep -q 'neonPassword' index.html
          ! grep -q 'neonSignIn' index.html
          ! grep -q 'neonSignUp' index.html
          ! grep -q 'neonGoogle' index.html
          ! grep -q 'neonForgot' index.html
          ! grep -q 'NEON_AUTH_URL' index.html
          ! grep -q 'neon.auth' index.html
          echo "Contest persistence and authentication removal verified."

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separate Mega Analyzer data by contest"
          git push
