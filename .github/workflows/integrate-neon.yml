name: Remove authentication from Mega Analyzer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove authentication block and code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove the complete visible authentication/saving account panel.
          text = re.sub(
              r'\n?<!-- NEON-MEGA-INTEGRATION -->.*?</section>\n\n',
              '\n',
              text,
              count=1,
              flags=re.S
          )

          # Remove the Neon authentication/integration script block.
          marker = '<script type="module">'
          start = text.find(marker)
          if start != -1:
              end = text.find('</script>', start)
              if end != -1:
                  block = text[start:end + len('</script>')]
                  if 'neon.auth' in block or 'NEON_AUTH_URL' in block or 'mega_contests' in block:
                      text = text[:start] + text[end + len('</script>'):]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify authentication was removed
        run: |
          ! grep -q 'neonEmail' index.html
          ! grep -q 'neonPassword' index.html
          ! grep -q 'neonSignIn' index.html
          ! grep -q 'neonSignUp' index.html
          ! grep -q 'neonGoogle' index.html
          ! grep -q 'neonForgot' index.html
          ! grep -q 'NEON_AUTH_URL' index.html
          ! grep -q 'mega_contests' index.html
          echo "Authentication block removed successfully."

      - name: Commit removal
        run: |
          if git diff --quiet -- index.html; then
            echo "No authentication code found; nothing to change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove authentication from Mega Analyzer"
          git push
