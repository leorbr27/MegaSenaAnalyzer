name: Update Mega Analyzer persistence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply contest persistence
        run: python3 scripts/add_contest_persistence.py

      - name: Verify app
        run: |
          grep -q 'id="contestCard"' index.html
          grep -q 'function saveCurrentContest' index.html
          grep -q 'function loadContest' index.html
          ! grep -q 'neonEmail' index.html
          ! grep -q 'neonPassword' index.html
          ! grep -q 'neonSignIn' index.html
          ! grep -q 'neonSignUp' index.html
          ! grep -q 'neonGoogle' index.html
          ! grep -q 'neonForgot' index.html
          ! grep -q 'NEON_AUTH_URL' index.html
          ! grep -q 'neon.auth' index.html

      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separate Mega Analyzer data by contest"
          git push
