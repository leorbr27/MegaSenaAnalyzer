name: Validate Neon integration

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate integration marker
        run: |
          grep -q '<!-- NEON-MEGA-INTEGRATION -->' index.html
          grep -q 'quotaValue' index.html
          grep -q 'mega_contests' index.html
          echo "Neon integration markers validated."
