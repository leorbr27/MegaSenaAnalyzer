name: Corrigir autenticação do Mega Analyzer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir autenticação no index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_button = '''  <button id="neonGoogle" class="light">Continuar com Google</button>'''
          new_button = '''  <button id="neonGoogle" class="light">Continuar com Google</button>\n  <button id="neonForgot" class="light">🔑 Esqueci minha senha</button>'''
          if old_button not in text:
              raise SystemExit("Botão do Google não encontrado; arquivo não foi alterado.")
          text = text.replace(old_button, new_button, 1)

          old_google = '''$('neonGoogle').onclick=async()=>{ try{ await neon.auth.signIn.social({provider:'google',callbackURL:location.href}); }catch(e){msg('Não foi possível iniciar o Google: '+(e.message||e),'danger');} };'''
          new_google = '''$('neonGoogle').onclick=async()=>{\n  try{\n    const callbackURL = new URL('./', location.href).href;\n    await neon.auth.signIn.social({provider:'google',callbackURL});\n  }catch(e){\n    msg('Não foi possível iniciar o Google: '+(e.message||e),'danger');\n  }\n};\n\n$('neonForgot').onclick=async()=>{\n  const email=$('neonEmail').value.trim();\n  if(!email){\n    msg('Digite seu e-mail primeiro para receber o link de redefinição.','warning');\n    $('neonEmail').focus();\n    return;\n  }\n  try{\n    const redirectTo=new URL('./',location.href).href;\n    const r=await neon.auth.requestPasswordReset({email,redirectTo});\n    if(r?.error) throw r.error;\n    msg('Se esse e-mail estiver cadastrado, você receberá um link para criar uma nova senha. Verifique também a pasta de spam.','success');\n  }catch(e){\n    msg('Não foi possível solicitar a redefinição: '+(e.message||e),'danger');\n  }\n};\n\nasync function handlePasswordReset(){\n  const params=new URLSearchParams(location.search);\n  const token=params.get('token');\n  if(!token) return false;\n  const newPassword=window.prompt('Digite a nova senha (mínimo 8 caracteres):');\n  if(newPassword===null) return true;\n  if(newPassword.length<8){\n    msg('A nova senha precisa ter pelo menos 8 caracteres.','warning');\n    return true;\n  }\n  try{\n    const r=await neon.auth.resetPassword({newPassword,token});\n    if(r?.error) throw r.error;\n    history.replaceState({},document.title,location.pathname);\n    $('neonPassword').value=newPassword;\n    msg('Senha redefinida com sucesso. Agora clique em “Entrar”.','success');\n  }catch(e){\n    msg('Não foi possível redefinir a senha: '+(e.message||e),'danger');\n  }\n  return true;\n}'''
          if old_google not in text:
              raise SystemExit("Bloco do Google não encontrado; arquivo não foi alterado.")
          text = text.replace(old_google, new_google, 1)

          old_tail = '''await refreshAuth();\nif(activeContest && await currentUser()){ $('contestNumber').value=activeContest; try{ await loadContest(); }catch(e){ msg('Não foi possível carregar o último concurso: '+(e.message||e),'danger'); } }'''
          new_tail = '''const resetHandled=await handlePasswordReset();\nawait refreshAuth();\nif(!resetHandled && activeContest && await currentUser()){ $('contestNumber').value=activeContest; try{ await loadContest(); }catch(e){ msg('Não foi possível carregar o último concurso: '+(e.message||e),'danger'); } }'''
          if old_tail not in text:
              raise SystemExit("Final da autenticação não encontrado; arquivo não foi alterado.")
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text, encoding="utf-8")
          print("Autenticação atualizada com sucesso.")

      - name: Validar HTML básico
        run: |
          test -s index.html
          grep -q "neonForgot" index.html
          grep -q "requestPasswordReset" index.html
          grep -q "resetPassword" index.html

      - name: Publicar correção e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mega-auth-fix.yml
          git commit -m "fix: corrigir cadastro, login, Google e recuperação de senha"
          git push